name: muse_code
description: A project-based coding assistant where an orchestrator thread hands work to worker threads, built on flatkit.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flatkit:
    path: ../..
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
